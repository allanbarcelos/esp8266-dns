name: Compile the firmware
description: >
  Compiles the sketch for the ESP-01 (1 MB, 64 KB FS, 400 KB OTA reserve,
  lwIP without extras) and leaves the binary at build/firmware.raw.bin. Needs
  setup-arduino first.
inputs:
  version:
    description: Version embedded in the firmware (firmware_version)
    required: true
runs:
  using: composite
  steps:
    - name: Compile (ESP-01 1MB, 64KB FS, 400KB OTA reserve, lwIP without extras)
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        python3 tools/ota_flash_ld.py
        arduino-cli compile \
          --fqbn esp8266:esp8266:generic:eesz=1M64,ip=lm2n \
          --build-property "build.flash_ld=eagle.flash.1m64.ota.ld" \
          --build-property "build.float=" \
          --build-property "build.extra_flags=-Dfirmware_version=\"$VERSION\" -DARDUINO_SIGNING=1" \
          --output-dir build
        cp build/esp8266-dns.ino.bin build/firmware.raw.bin
