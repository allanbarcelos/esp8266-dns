name: Setup Arduino CLI (ESP8266)
description: Installs arduino-cli, ESP8266 core 3.1.2 and the firmware libraries
runs:
  using: composite
  steps:
    # Pinned version: a new arduino-cli must not break the build without a commit
    - uses: arduino/setup-arduino-cli@v2
      with:
        version: "1.5.1"

    - name: Cache the core and libraries
      uses: actions/cache@v6
      with:
        path: |
          ~/.arduino15
          ~/Arduino/libraries
        # Changes by itself when the core, a library or arduino-cli changes in this file
        key: arduino-${{ hashFiles('.github/actions/setup-arduino/action.yml') }}

    - name: Install the core and libraries
      shell: bash
      run: |
        arduino-cli config init --overwrite
        arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
        arduino-cli core update-index
        arduino-cli core install esp8266:esp8266@3.1.2
        arduino-cli lib install "ArduinoJson@6.21.6"
