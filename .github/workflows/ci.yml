name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar release mesmo sem mudanças no firmware"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Nunca cancelar na main: um release interrompido deixaria tag sem binário
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Esteira: plan → check → build → test → release → pages. Cada job faz uma
  # coisa; sem firmware novo, build, test e release são ignorados.

  # ── Decide: há firmware novo? qual versão? publica? ───────────────────────
  plan:
    # PR de branch deste repositório já roda no push; só PR de fork roda aqui
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.plan.outputs.firmware }}
      tests: ${{ steps.plan.outputs.tests }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      pages: ${{ steps.plan.outputs.pages }}
      site_version: ${{ steps.plan.outputs.site_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico + tags para o diff e o versionamento

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FORCE: ${{ inputs.release }}
          BEFORE: ${{ github.event.before }}
          # Tudo o que muda o binário ou o pacote publicado: sketch, CSS/JS do
          # painel, chave, linker, versão do core/bibliotecas, opções de
          # compilação e empacotamento OTA
          FIRMWARE_PATHS: '^([^/]+\.(ino|h)|web/|public\.key|ld/|tools/(ota_flash_ld|embed_web)\.py|\.github/(actions/(setup-arduino|compile)/|scripts/package_ota\.py))'
          # Só os testes: roda o test, sem build nem release
          TEST_PATHS: '^(test/|platformio\.ini|requirements\.txt)'
          # Instalador web: a página e o gerador do site
          PAGES_PATHS: '^(install/|tools/web_installer\.py)'
        run: |
          # Maior tag vN existente (ordenação numérica, sem limite de paginação)
          last=$(git tag -l 'v*' | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          last_tag="v${last:-0}"

          # Compara com a última tag publicada, não com o push anterior: um
          # run cancelado na fila ou um release que falhou não perde as
          # mudanças, o próximo push na main as publica.
          firmware=false
          tests=false
          if ! git rev-parse -q --verify "refs/tags/$last_tag" >/dev/null; then
            firmware=true
          elif [ "$(git rev-parse "$last_tag^{commit}")" = "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA já publicado como $last_tag"
          else
            changed=$(git diff --name-only "$last_tag" "$GITHUB_SHA")
            if echo "$changed" | grep -qE "$FIRMWARE_PATHS"; then firmware=true; fi
            if echo "$changed" | grep -qE "$TEST_PATHS"; then tests=true; fi
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            firmware=true
          fi

          release=false
          if [ "$REF" = "refs/heads/main" ] && [ "$firmware" = "true" ] \
             && { [ "$EVENT" = "push" ] || [ "$FORCE" = "true" ]; }; then
            release=true
          fi

          if [ "$release" = "true" ]; then
            version="v$(( ${last:-0} + 1 ))"
          else
            version="ci-${GITHUB_SHA::7}"
          fi

          # Instalador web na main: com release novo, quando a página muda
          # (diff com o push anterior) ou em Run workflow. Grava sempre uma
          # versão publicada: a nova ou a última tag.
          pages=false
          if [ "$REF" = "refs/heads/main" ] && [ "$EVENT" != "pull_request" ]; then
            if [ "$release" = "true" ] || [ "$EVENT" = "workflow_dispatch" ]; then
              pages=true
            elif [ "$EVENT" = "push" ]; then
              if ! git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
                pages=true   # push sem base conhecida (branch nova, force push)
              elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE "$PAGES_PATHS"; then
                pages=true
              fi
            fi
          fi
          if [ "$release" = "true" ]; then
            site_version="$version"
          else
            site_version="$last_tag"
            if [ -z "$last" ]; then pages=false; fi   # nada publicado ainda
          fi

          {
            echo "firmware=$firmware"
            echo "tests=$tests"
            echo "release=$release"
            echo "version=$version"
            echo "pages=$pages"
            echo "site_version=$site_version"
          } >> "$GITHUB_OUTPUT"
          echo "Firmware novo: $firmware — testes: $tests — release: $release — versão: $version (última tag: $last_tag) — instalador web: $pages ($site_version)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Regras do repositório (segundos, sempre) ──────────────────────────────
  check:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cabeçalho de licença em todo arquivo de código
        run: python3 tools/license_headers.py --check

  # ── Gera o firmware: compila, mede e empacota ─────────────────────────────
  # Vem antes dos testes: testes verdes com um firmware acima do limite não
  # valem nada, o aparelho ainda pode travar.
  build:
    needs: [plan, check]
    if: needs.plan.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: CSS e JS embutidos (WebAssets.h igual a web/)
        run: python3 tools/embed_web.py --check

      - name: Raízes TLS embutidas (CloudflareCA.h igual a ca/roots.pem)
        run: python3 tools/embed_ca.py --check

      - uses: ./.github/actions/setup-arduino

      - uses: ./.github/actions/compile
        with:
          version: ${{ needs.plan.outputs.version }}

      # Regra do projeto: nenhuma funcionalidade ou correção passa o
      # firmware de 500.000 bytes
      - name: Firmware dentro do limite de 500.000 bytes
        run: |
          set -o pipefail
          python3 tools/firmware_limit.py build/firmware.raw.bin | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verifica que a checagem de assinatura foi embutida
        run: grep -q "updaterSigningVerifier" build/esp8266-dns.ino.map

      # Chave descartável: só para medir o tamanho real de firmware.signed.bin
      # (gzip + assinatura de 256 B) em todo push/PR, sem o segredo de release.
      # Sem isso, um binário que cresce até quase encher a reserva passaria
      # aqui e só falharia no release, com a chave de produção.
      - name: Gera chave de teste para medir o tamanho assinado
        run: |
          openssl genrsa -out "$RUNNER_TEMP/test.key" 2048
          openssl rsa -in "$RUNNER_TEMP/test.key" -pubout -out "$RUNNER_TEMP/test.pub"

      - name: Empacota e valida OTA (tamanho real, com e sem assinatura)
        run: |
          python3 .github/scripts/package_ota.py build/firmware.raw.bin dist \
            --map build/esp8266-dns.ino.map \
            --key "$RUNNER_TEMP/test.key" --pubkey "$RUNNER_TEMP/test.pub"

      # O mesmo gerador do job pages: imagem do ESP8266, dentro do sketch
      # máximo e com a versão que o manifesto anuncia
      - name: Monta o instalador web (conferência)
        run: |
          python3 tools/web_installer.py build/firmware.raw.bin \
            "${{ needs.plan.outputs.version }}" "$RUNNER_TEMP/site"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ needs.plan.outputs.version }}
          path: build/firmware.raw.bin
          retention-days: 14

  # ── Testes nativos com cobertura obrigatória de 100% ──────────────────────
  # Com firmware novo, depois do build; com mudança só nos testes, sem ele
  # (o build fica ignorado, e um job ignorado não bloqueia este).
  test:
    needs: [plan, check, build]
    if: >-
      !failure() && !cancelled() &&
      (needs.plan.outputs.firmware == 'true' || needs.plan.outputs.tests == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini', 'requirements.txt') }}

      - name: Instala PlatformIO e gcovr
        run: pip install -r requirements.txt

      - name: Testes + cobertura (100% linhas/funções/branches)
        run: ./test/coverage.sh

      # Estouro de buffer, uso depois de liberar, vazamento e comportamento
      # indefinido param o teste (a cobertura não pega nada disso)
      - name: Testes com AddressSanitizer e UndefinedBehaviorSanitizer
        run: pio test -e sanitize

  # ── Assina e publica (apenas push na main com firmware novo) ──────────────
  release:
    needs: [plan, build, test]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware-${{ needs.plan.outputs.version }}
          path: build

      - name: Assina e valida OTA
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::Secret OTA_SIGNING_KEY não configurado — release abortado"
            exit 1
          fi
          key="$RUNNER_TEMP/ota.key"
          umask 077
          printf '%s\n' "$OTA_SIGNING_KEY" > "$key"
          python3 .github/scripts/package_ota.py build/firmware.raw.bin dist --key "$key"
          rm -f "$key"

      - name: Publica GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ESP8266 Firmware ${{ needs.plan.outputs.version }}
          files: |
            dist/firmware.bin
            dist/firmware.signed.bin
          fail_on_unmatched_files: true

  # ── Instalador web (ESP Web Tools) no GitHub Pages ────────────────────────
  # O firmware vem do firmware.bin do release (gzip do .bin cru): a página
  # só grava versões publicadas. Requer Settings → Pages → Source: GitHub
  # Actions.
  pages:
    needs: [plan, release]
    if: >-
      !failure() && !cancelled() && needs.plan.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Baixa o firmware do release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.site_version }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern firmware.bin --dir build

      - name: Monta o site
        env:
          TAG: ${{ needs.plan.outputs.site_version }}
        run: python3 tools/web_installer.py build/firmware.bin "$TAG" site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
