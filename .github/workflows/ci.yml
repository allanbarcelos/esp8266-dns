name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publicar release mesmo sem mudanças no firmware"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Nunca cancelar na main: um release interrompido deixaria tag sem binário
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Checagens antes de tudo: se uma falhar, nada mais roda ────────────────
  # Testes verdes com um firmware acima do limite não valem nada: o aparelho
  # ainda pode travar. Por isso plan e test só começam depois daqui.
  check:
    # PR de branch deste repositório já roda no push; só PR de fork roda aqui
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Rápidas primeiro (segundos, sem compilar)
      - name: Cabeçalho de licença em todo arquivo de código
        run: python3 tools/license_headers.py --check

      - name: CSS e JS embutidos (WebAssets.h igual a web/)
        run: python3 tools/embed_web.py --check

      # Regra do projeto: nenhuma funcionalidade ou correção passa o firmware
      # de 500.000 bytes. A versão ci-<sha> é a mais longa que o binário
      # recebe (a de release, vN, é menor): o que passa aqui passa no release.
      - uses: ./.github/actions/setup-arduino

      - id: version
        run: echo "version=ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/compile
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Firmware dentro do limite de 500.000 bytes
        run: |
          set -o pipefail
          python3 tools/firmware_limit.py build/firmware.raw.bin | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Decide se este push publica release e qual será a versão ──────────────
  plan:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico + tags para o diff e o versionamento

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FORCE: ${{ inputs.release }}
          # Tudo o que muda o binário ou o pacote publicado: sketch, chave,
          # linker, versão do core/bibliotecas, opções de compilação e empacotamento OTA
          FIRMWARE_PATHS: '^([^/]+\.(ino|h)|public\.key|ld/|tools/ota_flash_ld\.py|\.github/(actions/(setup-arduino|compile)/|scripts/package_ota\.py))'
        run: |
          # Maior tag vN existente (ordenação numérica, sem limite de paginação)
          last=$(git tag -l 'v*' | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          last_tag="v${last:-0}"

          # Compara com a última tag publicada, não com o push anterior:
          # um run cancelado na fila ou um release que falhou não perde
          # as mudanças, o próximo push na main as publica.
          release=false
          if [ "$REF" = "refs/heads/main" ]; then
            if ! git rev-parse -q --verify "refs/tags/$last_tag" >/dev/null; then
              changed=true
            elif [ "$(git rev-parse "$last_tag^{commit}")" = "$GITHUB_SHA" ]; then
              changed=already # re-run de um commit já publicado
            elif git diff --name-only "$last_tag" "$GITHUB_SHA" \
                 | grep -qE "$FIRMWARE_PATHS"; then
              changed=true
            else
              changed=false
            fi

            if [ "$changed" = "already" ]; then
              echo "::notice::$GITHUB_SHA já publicado como $last_tag"
            elif [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
              release=true
            elif [ "$EVENT" = "push" ] && [ "$changed" = "true" ]; then
              release=true
            fi
          fi

          if [ "$release" = "true" ]; then
            version="v$(( ${last:-0} + 1 ))"
          else
            version="ci-${GITHUB_SHA::7}"
          fi

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release: $release — versão: $version (última tag: $last_tag)"

  # ── Testes nativos com cobertura obrigatória de 100% ──────────────────────
  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini', 'requirements.txt') }}

      - name: Instala PlatformIO e gcovr
        run: pip install -r requirements.txt

      - name: Testes + cobertura (100% linhas/funções/branches)
        run: ./test/coverage.sh

  # ── Compila o firmware real e valida o empacotamento OTA ─────────────────
  build:
    needs: [plan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-arduino

      - uses: ./.github/actions/compile
        with:
          version: ${{ needs.plan.outputs.version }}

      # Confere de novo o binário que vai para o release
      - name: Firmware dentro do limite de 500.000 bytes
        run: python3 tools/firmware_limit.py build/firmware.raw.bin

      - name: Verifica que a checagem de assinatura foi embutida
        run: grep -q "updaterSigningVerifier" build/esp8266-dns.ino.map

      # Chave descartável: só para medir o tamanho real de firmware.signed.bin
      # (gzip + assinatura de 256 B) em todo push/PR, sem o segredo de release.
      # Sem isso, um binário que cresce até quase encher a reserva passaria
      # aqui e só falharia no release, com a chave de produção.
      - name: Gera chave de teste para medir o tamanho assinado
        run: |
          openssl genrsa -out "$RUNNER_TEMP/test.key" 2048
          openssl rsa -in "$RUNNER_TEMP/test.key" -pubout -out "$RUNNER_TEMP/test.pub"

      - name: Empacota e valida OTA (tamanho real, com e sem assinatura)
        run: |
          python3 .github/scripts/package_ota.py build/firmware.raw.bin dist \
            --map build/esp8266-dns.ino.map \
            --key "$RUNNER_TEMP/test.key" --pubkey "$RUNNER_TEMP/test.pub"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ needs.plan.outputs.version }}
          path: build/firmware.raw.bin
          retention-days: 14

  # ── Assina e publica (apenas push na main com mudanças no firmware) ──────
  release:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware-${{ needs.plan.outputs.version }}
          path: build

      - name: Assina e valida OTA
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::Secret OTA_SIGNING_KEY não configurado — release abortado"
            exit 1
          fi
          key="$RUNNER_TEMP/ota.key"
          umask 077
          printf '%s\n' "$OTA_SIGNING_KEY" > "$key"
          python3 .github/scripts/package_ota.py build/firmware.raw.bin dist --key "$key"
          rm -f "$key"

      - name: Publica GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ESP8266 Firmware ${{ needs.plan.outputs.version }}
          files: |
            dist/firmware.bin
            dist/firmware.signed.bin
          fail_on_unmatched_files: true
