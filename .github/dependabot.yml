# The workflow actions are pinned by commit (a moved tag cannot change what
# builds and signs the firmware). Dependabot opens a pull request when a new
# release comes out, with the commit and the version in the comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-arduino
      - /.github/actions/compile
    schedule:
      interval: monthly
