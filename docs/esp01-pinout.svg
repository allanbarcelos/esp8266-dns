<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 700" font-family="system-ui,Segoe UI,Roboto,Arial,sans-serif" role="img" aria-labelledby="t">
<title id="t">ESP-01 pins, top view, antenna on the left</title>
