<g font-size="14" fill="#aab3bd"><text x="586" y="260" text-anchor="end">GPIO3</text><text x="824" y="170">3.3 V</text><text x="824" y="440">GPIO1</text></g>
<rect x="40" y="528" width="22" height="22" rx="4" fill="#1f8a4c"/><rect x="290" y="528" width="22" height="22" rx="4" fill="#d2691e"/><rect x="540" y="528" width="22" height="22" rx="4" fill="#2f6fc0"/><rect x="790" y="528" width="22" height="22" rx="4" fill="#6b7280"/>
