<text x="340" y="300" font-size="14" fill="#c9d1d9" text-anchor="middle">ESP8266EX</text>
<g font-size="11" font-weight="700" fill="#c9d1d9" text-anchor="middle">
<text x="620" y="124">5</text><text x="620" y="214">7</text><text x="620" y="304">1</text><text x="620" y="394">3</text>
<text x="790" y="124">8</text><text x="790" y="214">6</text><text x="790" y="304">4</text><text x="790" y="394">2</text>
