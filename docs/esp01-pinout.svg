<g font-size="15" fill="#3d4650"><text x="72" y="561">sensor or module</text><text x="322" y="561">VCC is 3.3 V</text><text x="572" y="561">CH_PD stays at 3.3 V</text><text x="822" y="561">GND, common ground</text>
<text x="40" y="614">GPIO0 and GPIO2 are high at boot. The relay must be off with the pin high.</text>
<text x="40" y="642">TX and RX also work as GPIO after flashing. This board only reads digital inputs.</text>
<text x="40" y="684" fill="#5b6570">Pins 1 to 8 in the module's physical order. The sensor and the module use different pins.</text></g>
