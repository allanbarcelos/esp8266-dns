[platformio]
src_dir = .

; ── Firmware real (desenvolvimento local; o release é feito pelo CI) ─────────
; pre: embute public.key antes do core e da biblioteca Wi-Fi.
; post: o link falha se updaterSigningVerifier não estiver no ELF.
; Sem a chave o OTA baixa o gzip puro; com ela, o arquivo assinado.
[env:esp8266]
platform = espressif8266
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ota.ld  ; 1M64 com 400 KB de reserva OTA
framework = arduino
extra_scripts =
    pre:tools/ota_flash_ld.py
    pre:tools/embed_pubkey.py
    post:tools/embed_pubkey.py
    post:tools/no_printf_float.py  ; igual ao build.float= do CI
; OTAService escolhe o asset por esta macro. O header gerado repete o 1
; no Updater; sem o -D o sketch compilava o caminho do gzip puro.
; lwIP sem extras (≈10 KB): igual ao ip=lm2n do CI. Fica de fora o que o
; aparelho não usa (NAT, fragmentação IP, AutoIP) e o SNTP guarda um
; servidor só (Clock alterna entre dois).
build_flags =
    -DARDUINO_SIGNING=1
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
build_src_filter = +<*> -<test/> -<.github/>  ; src_dir = . — não compilar os testes
lib_deps =
    bblanchon/ArduinoJson@6.21.6  ; igual ao CI (setup-arduino)

; ── Testes nativos (host) ───────────────────────────────────────────────────
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>          ; não compila o .ino no env nativo
build_flags =
    -std=c++17
    -fno-exceptions                      ; igual ao firmware (core ESP8266: exceptions=disabled)
    -I test/stubs                        ; stubs Arduino antes de qualquer path do sistema
    -I .                                 ; headers do projeto (.h na raiz)
    -Dfirmware_version=\"dev\"
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1  ; habilita as<String>() com nosso mock
    -DARDUINOJSON_ENABLE_PROGMEM=0         ; desabilita pgm_read_byte / FlashString
    -Wl,--wrap=malloc                      ; test_support.h simula malloc sem memória
lib_deps =
    bblanchon/ArduinoJson@6.21.6  ; igual ao CI (setup-arduino)

; ── Testes nativos com cobertura (gcc + gcovr; usado no CI) ──────────────────
; -fkeep-inline-functions garante que métodos nunca chamados apareçam no
; relatório como não cobertos (headers-only seriam omitidos silenciosamente).
[env:coverage]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O0
    --coverage
    -fkeep-inline-functions
extra_scripts = post:test/coverage_link.py
