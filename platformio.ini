[platformio]
src_dir = .

; ── Real firmware (local development; CI makes the release) ──────────────────
; pre: embeds public.key before the core and the Wi-Fi library.
; post: the link fails if updaterSigningVerifier is not in the ELF.
; Without the key OTA downloads the plain gzip; with it, the signed file.
[env:esp8266]
platform = espressif8266
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ota.ld  ; 1M64 with a 400 KB OTA reserve
board_build.f_cpu = 160000000L                  ; same as CI's xtal=160: TLS handshakes in about half the time
framework = arduino
extra_scripts =
    pre:tools/ota_flash_ld.py
    pre:tools/embed_pubkey.py
    post:tools/embed_pubkey.py
    post:tools/no_printf_float.py  ; same as CI's build.float=
    post:tools/firmware_limit.py   ; fails above 500,000 bytes, like CI
; OTAService picks the asset by this macro. The generated header repeats the 1
; in the Updater; without the -D the sketch compiled the plain gzip path.
; lwIP without extras (≈10 KB): same as CI's ip=lm2n. It leaves out what the
; device does not use (NAT, IP fragmentation, AutoIP) and SNTP keeps a
; single server (Clock alternates between two).
build_flags =
    -DARDUINO_SIGNING=1
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
    -DLFS_NO_ASSERT   ; same as CI: LittleFS debug asserts out (3.4 KB); errors stay return codes
build_src_filter = +<*> -<test/> -<.github/>  ; src_dir = . (do not compile the tests)

; ── Native tests (host) ─────────────────────────────────────────────────────
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>          ; does not compile the .ino in the native env
build_flags =
    -std=c++17
    -Wall -Wextra -Werror                ; a warning in the firmware headers breaks the test
    -fno-exceptions                      ; same as the firmware (ESP8266 core: exceptions=disabled)
    -I test/stubs                        ; Arduino stubs before any system path
    -I .                                 ; project headers (.h at the root)
    -Dfirmware_version=\"dev\"
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1  ; test oracle (MQTT discovery, Json.h): String with our mock
    -DARDUINOJSON_ENABLE_PROGMEM=0         ; disables pgm_read_byte / FlashString
    -Wl,--wrap=malloc                      ; test_support.h simulates malloc running out of memory
lib_deps =
    bblanchon/ArduinoJson@6.21.6  ; tests only: an independent check of the JSON the firmware writes and reads

; ── Native tests with coverage (gcc + gcovr; used in CI) ─────────────────────
; -fkeep-inline-functions makes methods that are never called show up in the
; report as uncovered (header-only code would be skipped silently).
[env:coverage]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O0
    --coverage
    -fkeep-inline-functions
extra_scripts = post:test/coverage_link.py

; ── Native tests with AddressSanitizer and UndefinedBehaviorSanitizer ────────
; Buffer overflow, use after free, leaks and undefined behavior
; (shift, signed overflow, alignment) stop the test right away.
; With optimization, GCC reports an uninitialized variable inside
; ArduinoJson (StringMover) that is a false positive: here it only warns. The
; no-warning rule applies to the native and coverage envs.
[env:sanitize]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -O1 -g -fno-omit-frame-pointer
    -Wno-error=uninitialized
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
extra_scripts = post:test/sanitize_link.py
